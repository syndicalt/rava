[package]
name = "rava-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/syndicalt/rava"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer_sys = { package = "libfuzzer-sys", version = "0.4" }
rava-core = { path = "../crates/rava-core" }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[[bin]]
name = "v0_wire_entrypoints"
path = "fuzz_targets/v0_wire_entrypoints.rs"
test = false
doc = false
bench = false
